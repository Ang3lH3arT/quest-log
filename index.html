<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>HAO YI'S QUEST SYSTEM</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --gold: #ffbd39; --blue: #58a6ff; --green: #3fb950; --red: #f85149; --text: #c9d1d9; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 80px; }
        .owner-header { text-align: left; margin-bottom: 15px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .owner-name { font-size: 14px; color: var(--blue); letter-spacing: 2px; font-weight: bold; text-transform: uppercase; }
        .app-title { font-size: 22px; font-weight: 900; margin: 0; color: white; }
        .status-card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid var(--gold); position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .lvl-row { display: flex; justify-content: space-between; align-items: flex-start; }
        .lvl-num { font-size: 48px; font-weight: 900; color: var(--gold); line-height: 1; }
        .wallet-box { text-align: right; }
        .voucher-badge { background: var(--red); color: white; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; border: 1px solid white; display: inline-block; margin-bottom: 5px;}
        .claimed-label { font-size: 10px; color: #8b949e; display: block; }
        .xp-bar-container { background: #30363d; height: 14px; border-radius: 7px; margin: 15px 0 5px; overflow: hidden; }
        .xp-bar-fill { background: linear-gradient(90deg, #ffbd39, #ff8c00); width: 0%; height: 100%; transition: width 0.8s; }
        .section-title { font-size: 16px; margin: 25px 0 12px; color: var(--blue); font-weight: bold; display: flex; justify-content: space-between; }
        .quest-card { background: var(--card); padding: 16px; border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center; border: 1px solid #30363d; transition: 0.3s; }
        .quest-info { flex-grow: 1; }
        .quest-title { font-weight: 600; font-size: 16px; display: block; color: white; }
        .quest-xp { font-size: 12px; color: var(--gold); }
        input[type="checkbox"] { width: 28px; height: 28px; accent-color: var(--green); margin-left: 10px; }
        .completed { opacity: 0.3; filter: grayscale(1); transform: scale(0.98); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: var(--card); padding: 10px; border-radius: 10px; }
        .cal-day { aspect-ratio: 1; border-radius: 3px; font-size: 9px; display: flex; align-items: center; justify-content: center; background: #21262d; }
        .cal-full { background: var(--green) !important; color: white; }
        .cal-partial { background: var(--gold) !important; color: black; }
        .btn-claim { background: #238636; color: white; border: none; padding: 14px; border-radius: 8px; width: 100%; margin-top: 15px; font-weight: bold; font-size: 14px; box-shadow: 0 4px 0 #1a6328; active { transform: translateY(2px); box-shadow: 0 2px 0 #1a6328; } }
        .btn-sync { background: #21262d; color: var(--blue); border: 1px solid var(--blue); padding: 12px; border-radius: 8px; width: 100%; margin-top: 20px; font-weight: bold; }
        .loading-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 1000; font-weight: bold; color: var(--gold); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); padding: 20px; z-index: 100; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #30363d; }
        textarea { width: 100%; background: #0d1117; color: white; border: 1px solid #30363d; padding: 10px; box-sizing: border-box; border-radius: 8px; font-family: monospace; }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay">⌛ SYNCING WITH CLOUD...</div>

    <div class="owner-header">
        <div class="owner-name">PROPERTY OF</div>
        <h1 class="app-title">HAO YI'S QUEST SYSTEM</h1>
    </div>

    <div class="status-card">
        <div class="lvl-row">
            <div><span style="font-size: 12px; color: var(--blue);">CURRENT LEVEL</span><div class="lvl-num" id="cur-lvl">0</div></div>
            <div class="wallet-box">
                <span class="voucher-badge">🎟️ <span id="v-avail">0</span> AVAILABLE</span>
                <span class="claimed-label">Used so far: <span id="v-used">0</span></span>
            </div>
        </div>
        <div class="xp-bar-container"><div class="xp-bar-fill" id="xp-fill"></div></div>
        <div style="font-size: 11px; display: flex; justify-content: space-between; margin-bottom: 10px;">
            <span>EXP: <span id="cur-xp">0</span> / <span id="target-xp">50</span></span>
            <span id="sync-status" style="color: #3fb950;">● Connected</span>
        </div>
        <button class="btn-claim" onclick="handleClaim()">🎁 CLAIM A REWARD</button>
    </div>

    <div class="section-title">ACTIVE QUESTS <span id="today-date" style="font-size:11px; font-weight:normal; color:#8b949e;"></span></div>
    <div id="today-list"></div>

    <div class="section-title" id="backlog-title" style="display:none; color:var(--red);">PENDING BACKLOG</div>
    <div id="backlog-list"></div>

    <div class="section-title">ACHIEVEMENT HISTORY</div>
    <div class="calendar-grid" id="calendar"></div>

    <button class="btn-sync" onclick="forceSync()">🔄 REFRESH FROM CLOUD</button>

    <div style="text-align:center; margin-top:30px;">
        <button onclick="openAdmin()" style="background:none; color:#30363d; font-size:11px; border:none; text-decoration: underline;">SYSTEM OVERRIDE (ADMIN)</button>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <h3>ADMIN OVERRIDE</h3>
            <textarea id="task-input" rows="8"></textarea>
            <button onclick="saveTasks()" style="background:var(--blue); color:white; width:100%; padding:12px; border:none; border-radius:8px; margin-top:10px; font-weight:bold;">SAVE CHANGES</button>
            <button onclick="closeAdmin()" style="background:none; color:#8b949e; width:100%; margin-top:10px; border:none;">CANCEL</button>
        </div>
    </div>

    <script>
        const ADMIN_PASS = "8888";
        // PASTE YOUR URL BELOW
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxKCcoHIQKhXrFlHNh3T99qTMit_zQDoPhRgpT7dzKphClyivE690hGxUGqGjK8IRMHdQ/exec";
        
        let state = { lvl: 0, xp: 0, lastDate: "", history: {}, vouchersUsed: 0 };
        let activeTasks = JSON.parse(localStorage.getItem('hy_tasks_v8')) || [
            { title: "⚔️ Language Master (BM/CN)", xp: 20 },
            { title: "🧠 Logic Storm (5 Math Qs)", xp: 20 },
            { title: "🏀 Power Up (50 Dribbles)", xp: 15 },
            { title: "🛡️ Focus Shield (25m Focus)", xp: 10 }
        ];

        async function init() {
            try {
                // Fetch latest data from Google Sheet
                const response = await fetch(WEB_APP_URL);
                const cloudData = await response.json();
                
                if (cloudData.lvl !== undefined) {
                    state.lvl = parseInt(cloudData.lvl) || 0;
                    state.xp = parseInt(cloudData.xp) || 0;
                    state.vouchersUsed = parseInt(cloudData.vouchersUsed) || 0;
                    state.history = JSON.parse(cloudData.history || "{}");
                }
            } catch (e) {
                console.error("Offline mode - using local storage");
                state = JSON.parse(localStorage.getItem('hy_master_v8')) || state;
                document.getElementById('sync-status').innerText = "○ Offline Mode";
                document.getElementById('sync-status').style.color = "#f85149";
            }

            const today = new Date().toLocaleDateString();
            state.lastDate = today;
            document.getElementById('loading').style.display = 'none';
            render();
            renderCalendar();
        }

        function getTargetXP(lvl) { return Math.floor(50 * Math.pow(1.1, lvl)); }

        function render() {
            const today = state.lastDate;
            const todayList = document.getElementById('today-list');
            const backlogList = document.getElementById('backlog-list');
            todayList.innerHTML = ''; backlogList.innerHTML = '';
            document.getElementById('today-date').innerText = today;
            
            let yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
            let yStr = yesterday.toLocaleDateString();

            activeTasks.forEach((t, i) => {
                const isDoneToday = state.history[today] && state.history[today].includes(i);
                todayList.innerHTML += `<div class="quest-card ${isDoneToday ? 'completed' : ''}"><div class="quest-info"><span class="quest-title">${t.title}</span><span class="quest-xp">+${t.xp} XP</span></div><input type="checkbox" ${isDoneToday ? 'checked disabled' : ''} onclick="complete('${today}', ${i}, ${t.xp})"></div>`;
                
                const isDoneYesterday = state.history[yStr] && state.history[yStr].includes(i);
                if (!isDoneYesterday) {
                    document.getElementById('backlog-title').style.display = 'flex';
                    backlogList.innerHTML += `<div class="quest-card"><div class="quest-info"><span class="quest-title">${t.title} <small>(Backlog)</small></span><span class="quest-xp">+${t.xp} XP</span></div><input type="checkbox" onclick="complete('${yStr}', ${i}, ${t.xp})"></div>`;
                }
            });

            const target = getTargetXP(state.lvl);
            document.getElementById('cur-lvl').innerText = state.lvl;
            document.getElementById('cur-xp').innerText = Math.floor(state.xp);
            document.getElementById('target-xp').innerText = target;
            document.getElementById('xp-fill').style.width = (state.xp / target * 100) + '%';
            document.getElementById('v-avail').innerText = state.lvl - state.vouchersUsed;
            document.getElementById('v-used').innerText = state.vouchersUsed;
            
            localStorage.setItem('hy_master_v8', JSON.stringify(state));
        }

        async function complete(dateStr, index, xp) {
            if (!state.history[dateStr]) state.history[dateStr] = [];
            state.history[dateStr].push(index);
            state.xp += xp;
            let target = getTargetXP(state.lvl);
            while (state.xp >= target) { 
                state.xp -= target; 
                state.lvl++; 
                target = getTargetXP(state.lvl); 
                alert("🎉 LEVEL UP! You earned 1 Voucher!");
            }
            render(); renderCalendar();
            await syncToCloud("Task Complete");
        }

        async function handleClaim() {
            const avail = state.lvl - state.vouchersUsed;
            if (avail <= 0) { alert("❌ No vouchers available!"); return; }
            if (prompt("ENTER ADMIN PASSWORD:") === ADMIN_PASS) {
                state.vouchersUsed++;
                render();
                await syncToCloud("Claimed Voucher");
                alert("✅ Claim successful!");
            }
        }

        async function syncToCloud(reason) {
            const syncData = { 
                lvl: state.lvl, xp: state.xp, vouchersUsed: state.vouchersUsed, 
                history: JSON.stringify(state.history), msg: reason 
            };
            try {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(syncData) });
            } catch (err) { console.log("Sync background failed"); }
        }

        async function forceSync() {
            document.getElementById('loading').style.display = 'flex';
            await init();
        }

        function renderCalendar() {
            const cal = document.getElementById('calendar'); cal.innerHTML = '';
            for (let i = 27; i >= 0; i--) {
                let d = new Date(); d.setDate(d.getDate() - i);
                let dStr = d.toLocaleDateString();
                let count = state.history[dStr] ? state.history[dStr].length : 0;
                let status = count >= activeTasks.length ? "cal-full" : (count > 0 ? "cal-partial" : "");
                cal.innerHTML += `<div class="cal-day ${status}">${d.getDate()}</div>`;
            }
        }

        function openAdmin() {
            if (prompt("ADMIN ACCESS:") === ADMIN_PASS) {
                document.getElementById('admin-modal').style.display = 'block';
                document.getElementById('task-input').value = activeTasks.map(t => `${t.title}|${t.xp}`).join('\n');
            }
        }
        function closeAdmin() { document.getElementById('admin-modal').style.display = 'none'; }
        function saveTasks() {
            const val = document.getElementById('task-input').value;
            activeTasks = val.split('\n').filter(l => l.includes('|')).map(l => {
                const [title, xp] = l.split('|'); return { title: title.trim(), xp: parseInt(xp) };
            });
            localStorage.setItem('hy_tasks_v8', JSON.stringify(activeTasks));
            closeAdmin(); render();
        }
        init();
    </script>
</body>
</html>
