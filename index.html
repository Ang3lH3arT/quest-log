<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>FAMILY QUEST SYSTEM V11</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --gold: #ffbd39; --blue: #58a6ff; --green: #3fb950; --red: #f85149; --text: #c9d1d9; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 100px; }
        .owner-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-bottom: 15px; }
        .app-title { font-size: 20px; font-weight: 900; color: white; margin: 0; }
        .status-card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid var(--gold); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .lvl-num { font-size: 48px; font-weight: 900; color: var(--gold); line-height: 1; }
        .xp-bar-container { background: #30363d; height: 12px; border-radius: 6px; margin: 15px 0 5px; overflow: hidden; }
        .xp-bar-fill { background: linear-gradient(90deg, var(--gold), #ff8c00); width: 0%; height: 100%; transition: width 0.8s; }
        .section-title { font-size: 14px; margin: 25px 0 10px; color: var(--blue); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .quest-card { background: var(--card); padding: 16px; border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center; border: 1px solid #30363d; position: relative; }
        .quest-info { flex-grow: 1; }
        .quest-title { font-weight: 600; font-size: 16px; color: white; display: block; }
        .quest-xp { font-size: 12px; color: var(--gold); }
        input[type="checkbox"] { width: 26px; height: 26px; accent-color: var(--green); }
        .completed { opacity: 0.3; filter: grayscale(1); }
        .btn-action { background: var(--green); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 10px; }
        .btn-admin { background: #21262d; color: #8b949e; border: 1px solid #30363d; padding: 5px 10px; border-radius: 5px; font-size: 11px; cursor: pointer; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 15px; width: 100%; max-width: 400px; border: 1px solid var(--blue); }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; margin: 10px 0; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 5px; box-sizing: border-box;}
    </style>
</head>
<body>

    <div id="loading-screen" style="position:fixed; inset:0; background:var(--bg); z-index:2000; display:none; justify-content:center; align-items:center;">SYNCING...</div>

    <div class="owner-header">
        <div>
            <div id="user-tag" style="font-size:10px; color:var(--blue); font-weight:bold;">OFFICER</div>
            <h1 class="app-title">QUEST LOG</h1>
        </div>
        <button class="btn-admin" onclick="openAdmin()">⚙️ ADMIN</button>
    </div>

    <div class="status-card">
        <div style="display:flex; justify-content:space-between;">
            <div><span style="font-size:11px;">LEVEL</span><div class="lvl-num" id="cur-lvl">0</div></div>
            <div style="text-align:right;"><span style="background:var(--red); padding:4px 8px; border-radius:10px; font-size:11px; font-weight:bold;">🎟️ <span id="v-avail">0</span> VOUCHERS</span></div>
        </div>
        <div class="xp-bar-container"><div class="xp-bar-fill" id="xp-fill"></div></div>
        <div style="font-size:11px; display:flex; justify-content:space-between;">
            <span>XP: <span id="cur-xp">0</span> / <span id="target-xp">50</span></span>
            <span id="sync-status" style="color:var(--green)">● Online</span>
        </div>
        <button class="btn-action" style="background:#238636; margin-top:15px;" onclick="handleClaim()">🎁 CLAIM REWARD</button>
    </div>

    <div class="section-title">TODAY'S MISSIONS</div>
    <div id="today-list"></div>

    <div id="backlog-area" style="display:none;">
        <div class="section-title" style="color:var(--red);">⚠️ BACKLOG (YESTERDAY)</div>
        <div id="backlog-list"></div>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">ADMIN PANEL</h3>
            <div id="quest-manager-list" style="max-height:200px; overflow-y:auto; margin-bottom:15px; border-bottom:1px solid #30363d;"></div>
            <p style="font-size:12px; color:var(--blue);">+ ADD NEW QUEST</p>
            <input type="text" id="new-q-title" placeholder="Quest Title (e.g. Chinese Essay)">
            <input type="number" id="new-q-xp" placeholder="XP Value (e.g. 20)">
            <button class="btn-action" onclick="addNewQuest()">ADD TO LIST</button>
            <button class="btn-action" style="background:#21262d; border:1px solid #30363d;" onclick="closeAdmin()">CLOSE</button>
        </div>
    </div>

    <script>
        const ADMIN_PASS = "8888";
        const WEB_APP_URL = "YOUR_GOOGLE_SCRIPT_URL_HERE"; // PASTE YOUR URL HERE

        let currentUser = localStorage.getItem('quest_user_v11');
        let state = { lvl: 0, xp: 0, history: {}, vouchersUsed: 0, customQuests: [] };

        async function init() {
            if (!currentUser) {
                let name = prompt("WHO ARE YOU? (Hao Yi / Jane Teo)");
                if (name) { currentUser = name; localStorage.setItem('quest_user_v11', name); }
                else return;
            }
            document.getElementById('user-tag').innerText = currentUser.toUpperCase();
            document.getElementById('loading-screen').style.display = 'flex';

            // Load Custom Quests from LocalStorage first
            state.customQuests = JSON.parse(localStorage.getItem(`quests_${currentUser}`)) || [
                { title: "⚔️ Language Master (BM/CN)", xp: 20 },
                { title: "🧠 Logic Storm (Math)", xp: 20 }
            ];

            try {
                const res = await fetch(`${WEB_APP_URL}?user=${encodeURIComponent(currentUser)}`);
                const cloud = await res.json();
                if (cloud.lvl !== undefined) {
                    state.lvl = parseInt(cloud.lvl);
                    state.xp = parseInt(cloud.xp);
                    state.vouchersUsed = parseInt(cloud.vouchersUsed);
                    state.history = JSON.parse(cloud.history || "{}");
                }
            } catch (e) { console.log("Offline mode"); }

            document.getElementById('loading-screen').style.display = 'none';
            render();
        }

        function render() {
            const todayStr = new Date().toLocaleDateString();
            let yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayStr = yesterday.toLocaleDateString();

            const tList = document.getElementById('today-list');
            const bList = document.getElementById('backlog-list');
            tList.innerHTML = ''; bList.innerHTML = '';
            let hasBacklog = false;

            state.customQuests.forEach((q, i) => {
                const doneToday = state.history[todayStr] && state.history[todayStr].includes(i);
                tList.innerHTML += `<div class="quest-card ${doneToday ? 'completed' : ''}"><div class="quest-info"><span class="quest-title">${q.title}</span><span class="quest-xp">+${q.xp} XP</span></div><input type="checkbox" ${doneToday ? 'checked disabled' : ''} onclick="complete('${todayStr}', ${i}, ${q.xp})"></div>`;
                
                const doneYesterday = state.history[yesterdayStr] && state.history[yesterdayStr].includes(i);
                if (!doneYesterday) {
                    hasBacklog = true;
                    bList.innerHTML += `<div class="quest-card" style="border-left:4px solid var(--red)"><div class="quest-info"><span class="quest-title">${q.title}</span><span class="quest-xp">+${q.xp} XP (Backlog)</span></div><input type="checkbox" onclick="complete('${yesterdayStr}', ${i}, ${q.xp})"></div>`;
                }
            });

            document.getElementById('backlog-area').style.display = hasBacklog ? 'block' : 'none';
            const target = Math.floor(50 * Math.pow(1.1, state.lvl));
            document.getElementById('cur-lvl').innerText = state.lvl;
            document.getElementById('cur-xp').innerText = Math.floor(state.xp);
            document.getElementById('target-xp').innerText = target;
            document.getElementById('xp-fill').style.width = (state.xp / target * 100) + '%';
            document.getElementById('v-avail').innerText = state.lvl - state.vouchersUsed;
            
            localStorage.setItem(`state_${currentUser}`, JSON.stringify(state));
        }

        async function complete(dateStr, idx, xp) {
    const taskTitle = state.customQuests[idx].title;
    
    // 1. Mark as Pending in Local Memory
    if (!state.pending) state.pending = {};
    if (!state.pending[dateStr]) state.pending[dateStr] = [];
    
    if (state.pending[dateStr].includes(idx)) return alert("Already awaiting approval!");

    state.pending[dateStr].push(idx);
    localStorage.setItem(`pending_${currentUser}`, JSON.stringify(state.pending));
    
    render();
    
    // 2. Notify the Google Sheet that a task is waiting for you
    await sync(`PENDING: ${taskTitle}`);
    alert("Quest submitted! Waiting for Papa to approve.");
}

function openAdmin() { 
    if (prompt("ADMIN PASS:") === ADMIN_PASS) { 
        document.getElementById('admin-modal').style.display = 'flex'; 
        renderAdminQueue();
    }
}

function renderAdminQueue() {
    const queueDiv = document.getElementById('quest-manager-list');
    queueDiv.innerHTML = "<h4>Pending Approvals</h4>";
    
    const pending = JSON.parse(localStorage.getItem(`pending_${currentUser}`)) || {};
    
    Object.keys(pending).forEach(date => {
        pending[date].forEach((taskIdx, listIdx) => {
            const task = state.customQuests[taskIdx];
            queueDiv.innerHTML += `
                <div style="background:#21262d; padding:10px; margin-bottom:5px; border-radius:5px; display:flex; justify-content:space-between; align-items:center;">
                    <div style="font-size:12px;"><b>${task.title}</b><br><small>${date}</small></div>
                    <button onclick="approveTask('${date}', ${taskIdx}, ${task.xp})" style="background:var(--green); color:white; border:none; padding:5px 10px; border-radius:3px;">APPROVE</button>
                </div>`;
        });
    });
}

async function approveTask(dateStr, taskIdx, xp) {
    // 1. Move from Pending to History
    if (!state.history[dateStr]) state.history[dateStr] = [];
    state.history[dateStr].push(taskIdx);
    
    // 2. Remove from Pending
    state.pending[dateStr] = state.pending[dateStr].filter(i => i !== taskIdx);
    localStorage.setItem(`pending_${currentUser}`, JSON.stringify(state.pending));

    // 3. Award XP
    state.xp += xp;
    let target = Math.floor(50 * Math.pow(1.1, state.lvl));
    while (state.xp >= target) { state.xp -= target; state.lvl++; target = Math.floor(50 * Math.pow(1.1, state.lvl)); }
    
    render();
    renderAdminQueue();
    await sync(`APPROVED: ${state.customQuests[taskIdx].title}`);
}
            if (!state.history[dateStr]) state.history[dateStr] = [];
            state.history[dateStr].push(idx);
            state.xp += xp;
            let target = Math.floor(50 * Math.pow(1.1, state.lvl));
            while (state.xp >= target) { state.xp -= target; state.lvl++; target = Math.floor(50 * Math.pow(1.1, state.lvl)); alert("LEVEL UP!"); }
            render();
            await sync("Update");
        }

        function openAdmin() { if (prompt("ADMIN PASS:") === ADMIN_PASS) { 
            document.getElementById('admin-modal').style.display = 'flex'; 
            const mList = document.getElementById('quest-manager-list');
            mList.innerHTML = '';
            state.customQuests.forEach((q, i) => {
                mList.innerHTML += `<div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px;"><span>${q.title}</span><span style="color:var(--red)" onclick="deleteQuest(${i})">REMOVE</span></div>`;
            });
        }}

        function closeAdmin() { document.getElementById('admin-modal').style.display = 'none'; }

        function addNewQuest() {
            const t = document.getElementById('new-q-title').value;
            const x = parseInt(document.getElementById('new-q-xp').value);
            if (t && x) {
                state.customQuests.push({ title: t, xp: x });
                localStorage.setItem(`quests_${currentUser}`, JSON.stringify(state.customQuests));
                document.getElementById('new-q-title').value = '';
                document.getElementById('new-q-xp').value = '';
                render();
                openAdmin(); // Refresh list
            }
        }

        function deleteQuest(i) {
            state.customQuests.splice(i, 1);
            localStorage.setItem(`quests_${currentUser}`, JSON.stringify(state.customQuests));
            render();
            openAdmin();
        }

        async function handleClaim() {
            if ((state.lvl - state.vouchersUsed) <= 0) return alert("No vouchers!");
            if (prompt("ADMIN PASS:") === ADMIN_PASS) { state.vouchersUsed++; render(); await sync("Claimed"); }
        }

        async function sync(msg) {
            const data = { user: currentUser, lvl: state.lvl, xp: state.xp, vouchersUsed: state.vouchersUsed, history: JSON.stringify(state.history), msg: msg };
            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
        }

        init();
    </script>
</body>
</html>
