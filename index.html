<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>QUESTLOCK V12.5 - MASTER</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --gold: #ffbd39; --blue: #58a6ff; --green: #3fb950; --red: #f85149; --text: #c9d1d9; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 100px; }
        .owner-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-bottom: 15px; }
        .app-title { font-size: 20px; font-weight: 900; color: white; margin: 0; }
        .status-card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid var(--gold); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .lvl-num { font-size: 48px; font-weight: 900; color: var(--gold); line-height: 1; }
        .xp-bar-container { background: #30363d; height: 12px; border-radius: 6px; margin: 15px 0 5px; overflow: hidden; }
        .xp-bar-fill { background: linear-gradient(90deg, var(--gold), #ff8c00); width: 0%; height: 100%; transition: width 0.8s; }
        .section-title { font-size: 14px; margin: 25px 0 10px; color: var(--blue); font-weight: bold; text-transform: uppercase; }
        .quest-card { background: var(--card); padding: 16px; border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center; border: 1px solid #30363d; }
        .quest-info { flex-grow: 1; }
        .quest-title { font-weight: 600; font-size: 16px; color: white; display: block; }
        .quest-xp { font-size: 12px; color: var(--gold); }
        .btn-action { background: var(--green); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn-admin { background: #21262d; color: #8b949e; border: 1px solid #30363d; padding: 5px 10px; border-radius: 5px; font-size: 11px; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 15px; width: 100%; max-width: 400px; border: 1px solid var(--blue); box-sizing: border-box; }
        .pending-tag { background: var(--gold); color: black; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 10px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; background: var(--card); padding: 10px; border-radius: 10px; border: 1px solid #30363d; }
        .cal-day { aspect-ratio: 1; border-radius: 4px; font-size: 10px; display: flex; align-items: center; justify-content: center; background: #21262d; color: #484f58; }
        .cal-done { background: var(--green) !important; color: white; }
    </style>
</head>
<body>

    <div id="loading-screen" style="position:fixed; inset:0; background:var(--bg); z-index:2000; display:none; justify-content:center; align-items:center; color:var(--gold);">LOADING SYSTEM...</div>

    <div id="user-modal" class="modal" style="display:flex;">
        <div class="modal-content" style="text-align:center;">
            <h2 style="color:white;">SELECT USER</h2>
            <button class="btn-action" onclick="selectUser('Hao Yi')">⚔️ HAO YI</button>
            <button class="btn-action" style="background:var(--blue);" onclick="selectUser('Jane Teo')">🌸 JANE TEO</button>
        </div>
    </div>

    <div class="owner-header">
        <div>
            <div id="user-tag" style="font-size:10px; color:var(--blue); font-weight:bold;">OFFICER</div>
            <h1 class="app-title">QUEST LOG</h1>
        </div>
        <button class="btn-admin" onclick="openAdmin()">⚙️ ADMIN</button>
    </div>

    <div class="status-card">
        <div style="display:flex; justify-content:space-between;">
            <div><span style="font-size:11px;">LEVEL</span><div class="lvl-num" id="cur-lvl">0</div></div>
            <div style="text-align:right;"><span style="background:var(--red); padding:4px 8px; border-radius:10px; font-size:11px; font-weight:bold;">🎟️ <span id="v-avail">0</span> VOUCHERS</span></div>
        </div>
        <div class="xp-bar-container"><div class="xp-bar-fill" id="xp-fill"></div></div>
        <div style="font-size:11px; display:flex; justify-content:space-between;">
            <span>XP: <span id="cur-xp">0</span> / <span id="target-xp">50</span></span>
            <span id="sync-status" style="color:var(--green)">● Sync Active</span>
        </div>
        <button class="btn-action" style="background:#238636; margin-top:15px;" onclick="handleClaim()">🎁 CLAIM REWARD</button>
    </div>

    <div class="section-title">TODAY'S MISSIONS</div>
    <div id="today-list"></div>

    <div id="backlog-area" style="display:none;">
        <div class="section-title" style="color:var(--red);">⚠️ BACKLOG (YESTERDAY)</div>
        <div id="backlog-list"></div>
    </div>

    <div class="section-title">ACHIEVEMENT HISTORY</div>
    <div class="calendar-grid" id="calendar"></div>

    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin:0 0 15px 0; color:var(--gold);">ADMIN COMMAND</h3>
            <div id="admin-tabs" style="display:flex; gap:10px; margin-bottom:15px;">
                <button onclick="switchAdminTab('queue')" style="flex:1; padding:5px;">APPROVALS</button>
                <button onclick="switchAdminTab('manage')" style="flex:1; padding:5px;">QUESTS</button>
            </div>
            <div id="admin-body" style="max-height:300px; overflow-y:auto;"></div>
            <hr style="border:0; border-top:1px solid #30363d; margin:15px 0;">
            <button class="btn-action" style="background:#21262d;" onclick="closeAdmin()">CLOSE ADMIN</button>
            <button class="btn-admin" style="width:100%; margin-top:10px;" onclick="logout()">LOGOUT / SWITCH USER</button>
        </div>
    </div>

    <script>
        const ADMIN_PASS = "8888";
        const WEB_APP_URL = "PASTE_YOUR_GOOGLE_SCRIPT_URL_HERE"; 

        let currentUser = localStorage.getItem('quest_user_v12');
        let state = { lvl: 0, xp: 0, history: {}, vouchersUsed: 0, customQuests: [], pending: {} };

        async function selectUser(name) {
            currentUser = name;
            localStorage.setItem('quest_user_v12', name);
            document.getElementById('user-modal').style.display = 'none';
            await init();
        }

        function logout() {
            localStorage.removeItem('quest_user_v12');
            location.reload();
        }

        async function init() {
            if (!currentUser) return;
            document.getElementById('user-modal').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'flex';
            document.getElementById('user-tag').innerText = currentUser.toUpperCase();

            // Load Quests
            state.customQuests = JSON.parse(localStorage.getItem(`quests_${currentUser}`)) || [
                { title: "⚔️ Language Master (BM/CN)", xp: 20 },
                { title: "🧠 Logic Storm (Math)", xp: 20 },
                { title: "🏀 Physical Training", xp: 15 }
            ];
            state.pending = JSON.parse(localStorage.getItem(`pending_${currentUser}`)) || {};

            try {
                const res = await fetch(`${WEB_APP_URL}?user=${encodeURIComponent(currentUser)}`);
                const cloud = await res.json();
                if (cloud.lvl !== undefined) {
                    state.lvl = parseInt(cloud.lvl);
                    state.xp = parseInt(cloud.xp);
                    state.vouchersUsed = parseInt(cloud.vouchersUsed);
                    state.history = JSON.parse(cloud.history || "{}");
                }
            } catch (e) { console.log("Offline mode"); }

            document.getElementById('loading-screen').style.display = 'none';
            render();
            renderCalendar();
        }

        function render() {
            const todayStr = new Date().toLocaleDateString();
            let yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayStr = yesterday.toLocaleDateString();

            const tList = document.getElementById('today-list');
            const bList = document.getElementById('backlog-list');
            tList.innerHTML = ''; bList.innerHTML = '';
            let hasBacklog = false;

            state.customQuests.forEach((q, i) => {
                const isPending = state.pending[todayStr] && state.pending[todayStr].includes(i);
                const isDone = state.history[todayStr] && state.history[todayStr].includes(i);
                
                tList.innerHTML += `
                    <div class="quest-card ${isDone ? 'completed' : ''}">
                        <div class="quest-info">
                            <span class="quest-title">${q.title} ${isPending ? '<span class="pending-tag">PENDING</span>' : ''}</span>
                            <span class="quest-xp">+${q.xp} XP</span>
                        </div>
                        <input type="checkbox" ${isDone || isPending ? 'checked disabled' : ''} onclick="submitQuest('${todayStr}', ${i})">
                    </div>`;

                const isDoneYest = state.history[yesterdayStr] && state.history[yesterdayStr].includes(i);
                const isPendingYest = state.pending[yesterdayStr] && state.pending[yesterdayStr].includes(i);
                if (!isDoneYest) {
                    hasBacklog = true;
                    bList.innerHTML += `
                        <div class="quest-card" style="border-left:4px solid var(--red)">
                            <div class="quest-info">
                                <span class="quest-title">${q.title} ${isPendingYest ? '<span class="pending-tag">PENDING</span>' : ''}</span>
                                <span class="quest-xp">+${q.xp} XP</span>
                            </div>
                            <input type="checkbox" ${isPendingYest ? 'checked disabled' : ''} onclick="submitQuest('${yesterdayStr}', ${i})">
                        </div>`;
                }
            });

            document.getElementById('backlog-area').style.display = hasBacklog ? 'block' : 'none';
            const target = Math.floor(50 * Math.pow(1.1, state.lvl));
            document.getElementById('cur-lvl').innerText = state.lvl;
            document.getElementById('cur-xp').innerText = Math.floor(state.xp);
            document.getElementById('target-xp').innerText = target;
            document.getElementById('xp-fill').style.width = (state.xp / target * 100) + '%';
            document.getElementById('v-avail').innerText = state.lvl - state.vouchersUsed;
            
            localStorage.setItem(`state_${currentUser}`, JSON.stringify(state));
        }

        async function submitQuest(dateStr, idx) {
            if (!state.pending[dateStr]) state.pending[dateStr] = [];
            state.pending[dateStr].push(idx);
            localStorage.setItem(`pending_${currentUser}`, JSON.stringify(state.pending));
            render();
            await sync(`SUBMITTED: ${state.customQuests[idx].title}`);
        }

        function renderCalendar() {
            const cal = document.getElementById('calendar'); cal.innerHTML = '';
            for (let i = 27; i >= 0; i--) {
                let d = new Date(); d.setDate(d.getDate() - i);
                let dStr = d.toLocaleDateString();
                let done = state.history[dStr] && state.history[dStr].length > 0;
                cal.innerHTML += `<div class="cal-day ${done ? 'cal-done' : ''}">${d.getDate()}</div>`;
            }
        }

        function openAdmin() { if (prompt("PASS:") === ADMIN_PASS) { document.getElementById('admin-modal').style.display = 'flex'; switchAdminTab('queue'); } }
        function closeAdmin() { document.getElementById('admin-modal').style.display = 'none'; }

        function switchAdminTab(tab) {
            const body = document.getElementById('admin-body');
            body.innerHTML = '';
            if (tab === 'queue') {
                body.innerHTML = '<h4>Pending Approvals</h4>';
                Object.keys(state.pending).forEach(date => {
                    state.pending[date].forEach(idx => {
                        const q = state.customQuests[idx];
                        body.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:10px; background:#0d1117; padding:10px; border-radius:5px;">
                            <span>${q.title} (${date})</span>
                            <button onclick="approve('${date}', ${idx}, ${q.xp})" style="background:var(--green); border:none; color:white; border-radius:3px; padding:5px 10px;">APPROVE</button>
                        </div>`;
                    });
                });
            } else {
                body.innerHTML = '<h4>Manage Quests</h4>';
                state.customQuests.forEach((q, i) => {
                    body.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>${q.title}</span><button onclick="removeQuest(${i})" style="color:var(--red); background:none; border:none;">REMOVE</button></div>`;
                });
                body.innerHTML += `<hr><input type="text" id="new-t" placeholder="Title" style="width:100%; margin-bottom:5px;"><input type="number" id="new-x" placeholder="XP" style="width:100%; margin-bottom:10px;"><button class="btn-action" onclick="addQuest()">+ ADD QUEST</button>`;
            }
        }

        async function approve(date, idx, xp) {
            if (!state.history[date]) state.history[date] = [];
            state.history[date].push(idx);
            state.pending[date] = state.pending[date].filter(i => i !== idx);
            state.xp += xp;
            let target = Math.floor(50 * Math.pow(1.1, state.lvl));
            while (state.xp >= target) { state.xp -= target; state.lvl++; target = Math.floor(50 * Math.pow(1.1, state.lvl)); alert("LEVEL UP!"); }
            localStorage.setItem(`pending_${currentUser}`, JSON.stringify(state.pending));
            render(); renderCalendar(); switchAdminTab('queue');
            await sync(`APPROVED: ${state.customQuests[idx].title}`);
        }

        function addQuest() {
            const t = document.getElementById('new-t').value;
            const x = parseInt(document.getElementById('new-x').value);
            if (t && x) { state.customQuests.push({title:t, xp:x}); localStorage.setItem(`quests_${currentUser}`, JSON.stringify(state.customQuests)); switchAdminTab('manage'); render(); }
        }

        function removeQuest(i) { state.customQuests.splice(i, 1); localStorage.setItem(`quests_${currentUser}`, JSON.stringify(state.customQuests)); switchAdminTab('manage'); render(); }

        async function handleClaim() { if ((state.lvl - state.vouchersUsed) > 0 && prompt("PASS:") === ADMIN_PASS) { state.vouchersUsed++; render(); await sync("CLAIMED"); } }

        async function sync(msg) {
            const data = { user: currentUser, lvl: state.lvl, xp: state.xp, vouchersUsed: state.vouchersUsed, history: JSON.stringify(state.history), msg: msg };
            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
        }
    </script>
</body>
</html>
