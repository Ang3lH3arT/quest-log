<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>FAMILY QUEST SYSTEM</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --gold: #ffbd39; --blue: #58a6ff; --green: #3fb950; --red: #f85149; --text: #c9d1d9; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 80px; }
        .owner-header { text-align: left; margin-bottom: 15px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .owner-name { font-size: 14px; color: var(--blue); letter-spacing: 2px; font-weight: bold; text-transform: uppercase; }
        .app-title { font-size: 22px; font-weight: 900; margin: 0; color: white; }
        .status-card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid var(--gold); position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .lvl-row { display: flex; justify-content: space-between; align-items: flex-start; }
        .lvl-num { font-size: 48px; font-weight: 900; color: var(--gold); line-height: 1; }
        .wallet-box { text-align: right; }
        .voucher-badge { background: var(--red); color: white; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; border: 1px solid white; display: inline-block; }
        .xp-bar-container { background: #30363d; height: 14px; border-radius: 7px; margin: 15px 0 5px; overflow: hidden; }
        .xp-bar-fill { background: linear-gradient(90deg, #ffbd39, #ff8c00); width: 0%; height: 100%; transition: width 0.8s; }
        .section-title { font-size: 16px; margin: 25px 0 12px; color: var(--blue); font-weight: bold; display: flex; justify-content: space-between; }
        .quest-card { background: var(--card); padding: 16px; border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center; border: 1px solid #30363d; }
        .quest-info { flex-grow: 1; }
        .quest-title { font-weight: 600; font-size: 16px; display: block; color: white; }
        .quest-xp { font-size: 12px; color: var(--gold); }
        input[type="checkbox"] { width: 28px; height: 28px; accent-color: var(--green); margin-left: 10px; }
        .completed { opacity: 0.3; filter: grayscale(1); }
        .backlog-card { border-left: 4px solid var(--red) !important; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: var(--card); padding: 10px; border-radius: 10px; }
        .cal-day { aspect-ratio: 1; border-radius: 3px; font-size: 9px; display: flex; align-items: center; justify-content: center; background: #21262d; }
        .cal-full { background: var(--green) !important; color: white; }
        .cal-partial { background: var(--gold) !important; color: black; }
        .btn-claim { background: #238636; color: white; border: none; padding: 14px; border-radius: 8px; width: 100%; margin-top: 15px; font-weight: bold; box-shadow: 0 4px 0 #1a6328; }
        .btn-sync { background: #21262d; color: var(--blue); border: 1px solid var(--blue); padding: 12px; border-radius: 8px; width: 100%; margin-top: 20px; font-weight: bold; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); padding: 20px; z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid #30363d; width: 100%; max-width: 300px; text-align: center; }
        .user-btn { background: #21262d; color: white; border: 1px solid var(--blue); padding: 15px; margin: 10px 0; width: 100%; border-radius: 10px; font-weight: bold; font-size: 18px; }
        #loading-screen { position: fixed; inset: 0; background: var(--bg); display: none; justify-content: center; align-items: center; z-index: 2000; color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>

    <div id="loading-screen">⌛ SYNCING CLOUD DATA...</div>

    <div id="user-modal" class="modal">
        <div class="modal-content">
            <h2 style="color:white; margin-top:0;">WHO IS ONLINE?</h2>
            <button class="user-btn" onclick="selectUser('Hao Yi')">⚔️ HAO YI</button>
            <button class="user-btn" onclick="selectUser('Jane Teo')">🌸 JANE TEO</button>
        </div>
    </div>

    <div class="owner-header">
        <div class="owner-name" id="user-tag">UNIDENTIFIED</div>
        <h1 class="app-title">QUEST LOG</h1>
    </div>

    <div class="status-card">
        <div class="lvl-row">
            <div><span style="font-size: 12px; color: var(--blue);">CURRENT LEVEL</span><div class="lvl-num" id="cur-lvl">0</div></div>
            <div class="wallet-box">
                <span class="voucher-badge">🎟️ <span id="v-avail">0</span> AVAILABLE</span>
            </div>
        </div>
        <div class="xp-bar-container"><div class="xp-bar-fill" id="xp-fill"></div></div>
        <div style="font-size: 11px; display: flex; justify-content: space-between; margin-bottom: 10px;">
            <span>EXP: <span id="cur-xp">0</span> / <span id="target-xp">50</span></span>
            <span id="sync-status" style="color: #3fb950;">● Connected</span>
        </div>
        <button class="btn-claim" onclick="handleClaim()">🎁 CLAIM A REWARD</button>
    </div>

    <div class="section-title">TODAY'S QUESTS <span id="today-date" style="font-size:11px; font-weight:normal; color:#8b949e;"></span></div>
    <div id="today-list"></div>

    <div id="backlog-section" style="display:none;">
        <div class="section-title" style="color:var(--red);">⚠️ PENDING BACKLOG (YESTERDAY)</div>
        <div id="backlog-list"></div>
    </div>

    <div class="section-title">ACHIEVEMENT HISTORY</div>
    <div class="calendar-grid" id="calendar"></div>

    <button class="btn-sync" onclick="init()">🔄 REFRESH FROM CLOUD</button>
    
    <div style="text-align:center; margin-top:20px;">
        <button onclick="logout()" style="background:none; border:none; color:#30363d; text-decoration:underline; font-size:11px;">SWITCH USER</button>
    </div>

    <script>
        const ADMIN_PASS = "8888";
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw0cToSOuHcWlLbsqwt3mkUNWVPxtdrEnICmfLKNL6MYi4Zyj_vAVainEYq8RNxKxsSow/exec";
        
        let currentUser = localStorage.getItem('quest_user_v10');
        let state = { lvl: 0, xp: 0, history: {}, vouchersUsed: 0 };
        
        const defaultTasks = {
            "Hao Yi": [
                { title: "⚔️ Language Master (BM/CN)", xp: 20 },
                { title: "🧠 Logic Storm (5 Math Qs)", xp: 20 },
                { title: "🏀 Power Up (50 Dribbles)", xp: 15 },
                { title: "🛡️ Focus Shield (25m Focus)", xp: 10 }
            ],
            "Jane Teo": [
                { title: "📚 Academic Excellence", xp: 25 },
                { title: "🎨 Creativity Quest", xp: 15 },
                { title: "🧬 Logic Challenge", xp: 20 },
                { title: "🧼 Daily Habit", xp: 10 }
            ]
        };

        async function selectUser(name) {
            currentUser = name;
            localStorage.setItem('quest_user_v10', name);
            document.getElementById('user-modal').style.display = 'none';
            await init();
        }

        function logout() {
            localStorage.removeItem('quest_user_v10');
            location.reload();
        }

        async function init() {
            if (!currentUser) {
                document.getElementById('user-modal').style.display = 'flex';
                return;
            }
            document.getElementById('loading-screen').style.display = 'flex';
            document.getElementById('user-tag').innerText = `OFFICER: ${currentUser.toUpperCase()}`;
            
            try {
                const response = await fetch(`${WEB_APP_URL}?user=${encodeURIComponent(currentUser)}`);
                const cloud = await response.json();
                if (cloud.lvl !== undefined) {
                    state.lvl = parseInt(cloud.lvl);
                    state.xp = parseInt(cloud.xp);
                    state.vouchersUsed = parseInt(cloud.vouchersUsed);
                    state.history = JSON.parse(cloud.history || "{}");
                }
            } catch (e) {
                state = JSON.parse(localStorage.getItem(`state_${currentUser}`)) || state;
            }
            document.getElementById('loading-screen').style.display = 'none';
            render();
            renderCalendar();
        }

        function getTargetXP(lvl) { return Math.floor(50 * Math.pow(1.1, lvl)); }

        function render() {
            const tasks = defaultTasks[currentUser] || defaultTasks["Hao Yi"];
            const todayStr = new Date().toLocaleDateString();
            
            let yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayStr = yesterday.toLocaleDateString();

            const tList = document.getElementById('today-list');
            const bList = document.getElementById('backlog-list');
            const bSection = document.getElementById('backlog-section');
            
            tList.innerHTML = ''; bList.innerHTML = '';
            let hasBacklog = false;

            tasks.forEach((t, i) => {
                // Today's Quests
                const doneToday = state.history[todayStr] && state.history[todayStr].includes(i);
                tList.innerHTML += `<div class="quest-card ${doneToday ? 'completed' : ''}"><div class="quest-info"><span class="quest-title">${t.title}</span><span class="quest-xp">+${t.xp} XP</span></div><input type="checkbox" ${doneToday ? 'checked disabled' : ''} onclick="complete('${todayStr}', ${i}, ${t.xp})"></div>`;
                
                // Yesterday's Backlog
                const doneYesterday = state.history[yesterdayStr] && state.history[yesterdayStr].includes(i);
                if (!doneYesterday) {
                    hasBacklog = true;
                    bList.innerHTML += `<div class="quest-card backlog-card"><div class="quest-info"><span class="quest-title">${t.title}</span><span class="quest-xp">+${t.xp} XP (Backlog)</span></div><input type="checkbox" onclick="complete('${yesterdayStr}', ${i}, ${t.xp})"></div>`;
                }
            });

            bSection.style.display = hasBacklog ? 'block' : 'none';

            const target = getTargetXP(state.lvl);
            document.getElementById('cur-lvl').innerText = state.lvl;
            document.getElementById('cur-xp').innerText = Math.floor(state.xp);
            document.getElementById('target-xp').innerText = target;
            document.getElementById('xp-fill').style.width = (state.xp / target * 100) + '%';
            document.getElementById('v-avail').innerText = state.lvl - state.vouchersUsed;
            
            localStorage.setItem(`state_${currentUser}`, JSON.stringify(state));
        }

        async function complete(dateStr, idx, xp) {
            if (!state.history[dateStr]) state.history[dateStr] = [];
            state.history[dateStr].push(idx);
            state.xp += xp;
            
            let target = getTargetXP(state.lvl);
            while (state.xp >= target) { state.xp -= target; state.lvl++; target = getTargetXP(state.lvl); alert("LEVEL UP! +1 Voucher"); }
            
            render(); renderCalendar();
            await sync(dateStr === new Date().toLocaleDateString() ? "Task Done" : "Backlog Cleared");
        }

        async function handleClaim() {
            if ((state.lvl - state.vouchersUsed) <= 0) return alert("No vouchers!");
            if (prompt("ADMIN PASS:") === ADMIN_PASS) {
                state.vouchersUsed++;
                render();
                await sync("Claimed Reward");
            }
        }

        async function sync(msg) {
            const data = { user: currentUser, lvl: state.lvl, xp: state.xp, vouchersUsed: state.vouchersUsed, history: JSON.stringify(state.history), msg: msg };
            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
        }

        function renderCalendar() {
            const cal = document.getElementById('calendar'); cal.innerHTML = '';
            const tasks = defaultTasks[currentUser] || defaultTasks["Hao Yi"];
            for (let i = 27; i >= 0; i--) {
                let d = new Date(); d.setDate(d.getDate() - i);
                let dStr = d.toLocaleDateString();
                let count = state.history[dStr] ? state.history[dStr].length : 0;
                let status = count >= tasks.length ? "cal-full" : (count > 0 ? "cal-partial" : "");
                cal.innerHTML += `<div class="cal-day ${status}">${d.getDate()}</div>`;
            }
        }
        init();
    </script>
</body>
</html>
